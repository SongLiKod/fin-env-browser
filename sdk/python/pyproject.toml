[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finenv-sdk"
version = "3.0.0"
description = "FinEnv fingerprint environment HTTP + CDP SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "FinEnv Team" }]
keywords = ["testing", "browser", "fingerprint", "playwright", "cdp"]
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[tool.setuptools]
packages = ["finenv"]

[tool.setuptools.package-data]
finenv = ["py.typed"]
