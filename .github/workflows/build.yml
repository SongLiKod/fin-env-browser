name: Build & Test FinEnv

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v1.2.0）。留空则仅构建上传 artifact，不打 Release。'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json

      - name: Frontend unit tests & build
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: JS SDK tests
        working-directory: sdk/js
        run: |
          npm ci
          npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          python -m compileall -q finenv
          python -m unittest discover -s tests -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Repository consistency checks
        run: node scripts/verify.mjs

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            targets: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="true"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p upload
          echo "Downloaded artifact tree:"
          find dist-artifacts -type f -print | sort
          mapfile -t FILES < <(find dist-artifacts -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No installer artifacts found."
            exit 1
          fi
          for SRC in "${FILES[@]}"; do
            BASE=$(basename "$SRC")
            SUFFIX="${BASE#FinEnv_}"
            # Drop the bundle version so the released name follows the tag.
            SUFFIX=$(printf '%s' "$SUFFIX" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+[_-]//')
            DEST="upload/FinEnv-${VERSION}-${SUFFIX}"
            cp "$SRC" "$DEST"
            echo "Prepared $DEST from $SRC"
          done
          ( cd upload && sha256sum FinEnv-* > SHA256SUMS.txt )
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
